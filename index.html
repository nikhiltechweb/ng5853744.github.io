
<script>
/* SUPABASE CONNECTION */
const SUPABASE_URL = "https://ihzvaqrkisosnbrmnjrv.supabase.co";
const SUPABASE_KEY = "sb_publishable_Kbvl3_dTe7s63EnpD7DOBg_TGJQ5bcR";

const loginScreen = document.getElementById("loginScreen");
const appShell = document.getElementById("appShell");
const message = document.getElementById("authMessage");
const submit = document.getElementById("authSubmit");
const authForm = document.getElementById("authForm");

let client = null;
let authMode = "login";
let busy = false;

function showMessage(text, error = false) {
  message.textContent = text;
  message.style.color = error ? "#ff8585" : "#52e0a0";
}

function showWebsite(user) {
  if (!user) {
    appShell.hidden = true;
    loginScreen.hidden = false;
    document.getElementById("userEmail").textContent = "";
    return;
  }

  loginScreen.hidden = true;
  appShell.hidden = false;
  document.getElementById("userEmail").textContent =
    user.email || "Member";
  document.getElementById("year").textContent =
    new Date().getFullYear();
}

/* CHANGE LOGIN / SIGNUP MODE */
function setAuthMode(mode) {
  authMode = mode;

  document.getElementById("loginTab").classList.toggle(
    "active", mode === "login"
  );
  document.getElementById("signupTab").classList.toggle(
    "active", mode === "signup"
  );

  document.getElementById("nameField").hidden =
    mode !== "signup";

  document.getElementById("fullName").required =
    mode === "signup";

  document.getElementById("forgotBtn").hidden =
    mode !== "login";

  document.getElementById("email").disabled =
    mode === "recovery";

  document.getElementById("email").required =
    mode !== "recovery";

  document.getElementById("password").placeholder =
    mode === "recovery"
      ? "Enter your new password"
      : "Minimum 6 characters";

  document.getElementById("password").autocomplete =
    mode === "login" ? "current-password" : "new-password";

  if (mode === "login") {
    submit.textContent = "LOGIN TO WEBSITE ↗";
    showMessage("Login to enter NikhilTechWorld.");
  } else if (mode === "signup") {
    submit.textContent = "CREATE FREE ACCOUNT ↗";
    showMessage("Create your free account.");
  } else {
    submit.textContent = "UPDATE PASSWORD";
    showMessage("Enter your new password.");
  }
}

document.getElementById("loginTab").addEventListener(
  "click", () => setAuthMode("login")
);

document.getElementById("signupTab").addEventListener(
  "click", () => setAuthMode("signup")
);

/* CHECK SUPABASE LIBRARY */
if (!window.supabase || !window.supabase.createClient) {
  showMessage(
    "Supabase library load nahi hui. Internet check karke page refresh karo.",
    true
  );
} else {
  client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  /* LOGIN, SIGNUP AND PASSWORD UPDATE */
  authForm.addEventListener("submit", async function(e) {
    e.preventDefault();

    if (busy || !client) return;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const name = document.getElementById("fullName").value.trim();

    if (password.length < 6) {
      showMessage("Password kam se kam 6 characters ka hona chahiye.", true);
      return;
    }

    if (authMode === "signup" && !name) {
      showMessage("Please enter your name.", true);
      return;
    }

    busy = true;
    submit.disabled = true;
    submit.textContent = "PLEASE WAIT...";

    try {
      let result;

      if (authMode === "recovery") {
        result = await client.auth.updateUser({
          password: password
        });

        if (result.error) throw result.error;

        showMessage("Password successfully update ho gaya! Ab login karo.");
        document.getElementById("password").value = "";
        document.getElementById("email").value = "";
        setAuthMode("login");
      }

      else if (authMode === "signup") {
        result = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { full_name: name },
            emailRedirectTo:
              window.location.origin + window.location.pathname
          }
        });

        if (result.error) throw result.error;

        if (result.data.session) {
          showMessage("Account successfully created!");
          showWebsite(result.data.user);
        } else {
          showMessage(
            "Account created! Email inbox check karo aur verification link par click karo. Phir login karo."
          );
        }
      }

      else {
        result = await client.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (result.error) throw result.error;

        showWebsite(result.data.user);
        showMessage("Login successful!");
      }

    } catch (err) {
      showMessage(err.message || "Something went wrong.", true);
    } finally {
      busy = false;
      submit.disabled = false;

      if (authMode === "login") {
        submit.textContent = "LOGIN TO WEBSITE ↗";
      } else if (authMode === "signup") {
        submit.textContent = "CREATE FREE ACCOUNT ↗";
      } else {
        submit.textContent = "UPDATE PASSWORD";
      }
    }
  });

  /* FORGOT PASSWORD */
  document.getElementById("forgotBtn").addEventListener(
    "click", async function() {
      if (busy) return;

      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Pehle apna email address enter karo.", true);
        document.getElementById("email").focus();
        return;
      }

      busy = true;
      document.getElementById("forgotBtn").disabled = true;
      showMessage("Password reset email bheji ja rahi hai...");

      try {
        const { error } = await client.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              window.location.origin + window.location.pathname
          }
        );

        if (error) throw error;

        showMessage(
          "Reset link bhej diya gaya hai. Apna email inbox check karo."
        );

      } catch (err) {
        showMessage(err.message, true);
      } finally {
        busy = false;
        document.getElementById("forgotBtn").disabled = false;
      }
    }
  );

  /* AUTH STATE CHANGES */
  client.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      showWebsite(null);
      setAuthMode("recovery");
      document.getElementById("password").value = "";
      showMessage("Ab apna naya password enter karo.");
    }

    if (event === "SIGNED_IN" && session && authMode !== "recovery") {
      showWebsite(session.user);
    }

    if (event === "SIGNED_OUT") {
      showWebsite(null);
    }
  });

  /* CHECK EXISTING LOGIN */
  (async function() {
    try {
      const { data, error } = await client.auth.getSession();

      if (error) throw error;

      if (data.session) {
        showWebsite(data.session.user);
      } else {
        showWebsite(null);
      }
    } catch (err) {
      showWebsite(null);
      showMessage("Session check error: " + err.message, true);
    }
  })();

  /* LOGOUT */
  document.getElementById("logoutBtn").addEventListener(
    "click", async function() {
      const { error } = await client.auth.signOut();

      if (error) {
        showMessage(error.message, true);
        return;
      }

      setAuthMode("login");
      document.getElementById("password").value = "";
      showWebsite(null);
      window.scrollTo(0, 0);
    }
  );
}

/* MOBILE MENU */
function toggleMenu() {
  document.getElementById("navLinks").classList.toggle("open");
}

document.querySelectorAll("#navLinks a").forEach(a => {
  a.addEventListener("click", () => {
    document.getElementById("navLinks").classList.remove("open");
  });
});

/* EDUCATIONAL DEMO TERMINAL */
const output = document.getElementById("termOutput");

const commands = {
  help: "Available: help, about, date, skills, status, clear",
  about: "NikhilTechWorld — Technology and AI learning project.",
  date: () => new Date().toString(),
  skills: "HTML • CSS • JavaScript • AI • Web Design",
  status: "SYSTEM STATUS: Demo terminal running normally."
};

document.getElementById("termForm").addEventListener("submit", e => {
  e.preventDefault();

  const input = document.getElementById("termCommand");
  const command = input.value.trim().toLowerCase();

  if (!command) return;

  const line = document.createElement("div");
  line.textContent = "visitor@ntw:~$ " + command;
  output.appendChild(line);

  if (command === "clear") {
    output.innerHTML = "<div>Terminal cleared. Type help.</div>";
  } else {
    const result = document.createElement("div");
    result.textContent = commands[command]
      ? (typeof commands[command] === "function"
          ? commands[command]()
          : commands[command])
      : "Command not found. Type help.";
    output.appendChild(result);
  }

  input.value = "";
});
   </script>
